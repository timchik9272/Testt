<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Сокращатель — vyy</title>
  <meta name="google-site-verification" content="2RGccrSRPOqq_ke9AJ-s9yIk8kKdZsrVo5zhkiGOPrU" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f0f2f5; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
      --primary:#3b82f6; --primary-dark:#2563eb; --ring:rgba(59,130,246,.35);
      --shadow:0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --radius:16px; --danger:#ef4444;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display:flex; flex-direction:column; align-items:center; padding:20px 16px;
      min-height: 100vh;
    }
    .container{width:100%; max-width:600px}
    
    /* Header Mobile Optimization */
    .header{
      display:flex; flex-direction: column; gap:12px; margin-bottom:24px;
    }
    @media(min-width: 480px) {
      .header { flex-direction: row; align-items: center; justify-content: space-between; }
    }
    
    .brand{font-size:24px; font-weight:800; letter-spacing:-0.5px; color:#111827}
    
    .top-actions {
      display:flex; gap:8px; align-items:center; width: 100%;
    }
    @media(min-width: 480px) { .top-actions { width: auto; } }

    .status{
      font-size:13px; font-weight:600; color:var(--muted);
      margin-right: auto;
    }
    
    /* Buttons */
    .btn-sm {
      padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; text-decoration: none;
      transition: background .2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost { background: #fff; color: var(--text); border: 1px solid #e5e7eb; }
    .btn-danger { color: var(--danger); background: #fee2e2; }

    /* Cards */
    .card{
      background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
      padding:20px; margin-bottom:20px;
    }
    
    label{display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px}
    input{
      width:100%; padding:14px; font-size:16px;
      border:1px solid #d1d5db; border-radius:12px; outline:0; background:#fff;
      transition:border-color .15s, box-shadow .15s; -webkit-appearance: none;
    }
    input:focus{border-color:var(--primary); box-shadow:0 0 0 4px var(--ring)}
    
    .form-grid { display: grid; gap: 16px; }
    @media(min-width: 500px) {
      .form-grid { grid-template-columns: 2fr 1fr; align-items: start; }
    }

    .btn-main {
      width:100%; padding:14px; border:0; border-radius:12px; cursor:pointer;
      background:var(--primary); color:#fff; font-size:16px; font-weight:700;
      transition:transform .05s; margin-top: 2px;
    }
    .btn-main:active { transform: scale(0.98); }

    /* List Styles for Mobile */
    .list { display: grid; gap: 12px; }
    .item {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; gap: 10px; position: relative;
    }
    
    .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .link-text {
      font-size: 15px; color: var(--primary-dark); text-decoration: none; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; display: block;
    }
    .original-link {
      font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;
    }

    .actions-bar {
      display: flex; gap: 8px; margin-top: 4px; overflow-x: auto;
    }
    .action-btn {
      padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
      background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151; flex-shrink: 0;
    }
    
    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--muted);
      background: #f9fafb; border-radius: var(--radius); border: 2px dashed #e5e7eb;
    }

    /* Modal */
    .modal{
      position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6);
      display:flex; justify-content:center; align-items:flex-end; z-index:1000;
    }
    @media(min-width: 500px) { .modal { align-items: center; } }
    
    .modal-content{
      background:var(--card); padding:24px; border-radius: 20px 20px 0 0; width:100%; max-width:500px;
      animation: slideUp 0.2s ease-out;
    }
    @media(min-width: 500px) { 
      .modal-content { border-radius: 16px; animation: fadeIn 0.2s; } 
    }
    
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    footer { margin-top: 30px; font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">vyy</div>
      <div class="top-actions">
        <div id="userEmail" class="status">Гость</div>
        <a id="loginBtn" href="/auth.html" class="btn-sm btn-primary">Войти</a>
        <button id="logoutBtn" class="btn-sm btn-danger" style="display:none">Выйти</button>
      </div>
    </div>

    <div class="card">
      <form id="shortenForm">
        <div style="margin-bottom: 16px;">
          <label>Длинная ссылка</label>
          <input type="url" id="urlInput" required placeholder="https://..." />
        </div>
        
        <div class="form-grid">
          <div>
            <label>Ваш код (необязательно)</label>
            <input type="text" id="customCode" inputmode="latin" pattern="[A-Za-z0-9-_.~]{1,16}" placeholder="пример: go" />
          </div>
          <div style="align-self: end;">
            <button type="submit" class="btn-main">Сократить</button>
          </div>
        </div>
      </form>
    </div>

    <div id="listContainer">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding: 0 4px;">
        <h3 id="listTitle" style="margin:0; font-size:18px; font-weight:700"></h3>
        <button id="refreshBtn" class="action-btn">↻</button>
      </div>
      
      <input type="text" id="searchInput" placeholder="Поиск..." style="width:100%; margin-bottom:16px; padding:10px; border-radius:10px; border:1px solid #e5e7eb; font-size:14px;" />
      
      <div id="linksList" class="list"></div>
    </div>

    <div id="editModal" class="modal" style="display:none">
      <div class="modal-content">
        <h3 style="margin-top:0">Редактировать</h3>
        <form id="editForm">
          <label>URL</label>
          <input type="url" id="editUrlInput" required style="margin-bottom:12px" />
          <label>Код</label>
          <input type="text" id="editShortCode" required pattern="[A-Za-z0-9-_.~]{1,16}" style="margin-bottom:20px" />
          <input type="hidden" id="editLinkId" />
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px">
            <button type="button" class="btn-sm btn-ghost close-modal" style="text-align:center; padding:14px">Отмена</button>
            <button type="submit" class="btn-main" style="margin:0">Сохранить</button>
          </div>
        </form>
      </div>
    </div>

    <footer>vyy • Secure Shortener</footer>
  </div>

  <script>
    const SUPABASE_URL = "https://nsscaoqarmfslfdtwvma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7kiQMNJIhzz-R9szKkriwg_V-KlgbUm";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // ID Админа (видит всё)
    const ADMIN_UID = "8626c0b4-d51d-4033-91fe-84d4dffd85a0";
    
    // Ключ для уникальной сессии гостя
    const GUEST_SESSION_KEY = "vyy_guest_session_id";

    // Элементы
    const els = {
      loginBtn: document.getElementById("loginBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      userEmail: document.getElementById("userEmail"),
      listContainer: document.getElementById("listContainer"),
      listTitle: document.getElementById("listTitle"),
      linksList: document.getElementById("linksList"),
      form: document.getElementById("shortenForm"),
      urlInput: document.getElementById("urlInput"),
      customCode: document.getElementById("customCode"),
      refreshBtn: document.getElementById("refreshBtn"),
      searchInput: document.getElementById("searchInput"),
      editModal: document.getElementById("editModal")
    };

    let currentUser = null;
    let isAdmin = false;
    let allLinks = [];
    let guestSessionId = null;

    // --- UTILS ---
    function generateShortCode(length = 4) {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      return Array.from({ length }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    // --- AUTH & STATE ---
    async function initApp() {
      const { data: { user } } = await sb.auth.getUser();
      currentUser = user;
      isAdmin = user?.id === ADMIN_UID;
      
      // 1. Установка или получение ID гостевой сессии
      let storedGuestId = localStorage.getItem(GUEST_SESSION_KEY);
      if (!storedGuestId) {
        // Генерируем уникальный ID для этой сессии/браузера
        storedGuestId = `guest_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
        localStorage.setItem(GUEST_SESSION_KEY, storedGuestId);
      }
      guestSessionId = storedGuestId;

      if (user) {
        // User Logged In
        els.userEmail.textContent = user.email.split('@')[0];
        els.loginBtn.style.display = "none";
        els.logoutBtn.style.display = "inline-block";
      } else {
        // Guest
        els.userEmail.textContent = "Гость";
        els.loginBtn.style.display = "inline-block";
        els.logoutBtn.style.display = "none";
      }

      loadLinks();
    }

    els.logoutBtn.onclick = async () => {
      await sb.auth.signOut();
      window.location.reload();
    };

    // --- DATA LOADING ---
    async function loadLinks() {
      // Ключ и значение для фильтрации данных
      let filterKey;
      let filterValue;
      
      if (currentUser) {
        filterKey = "user_id";
        filterValue = currentUser.id;
        els.listTitle.textContent = isAdmin ? "Все ссылки (Админ)" : "Мои ссылки";
      } else {
        filterKey = "guest_session_id";
        filterValue = guestSessionId;
        els.listTitle.textContent = "Ваши ссылки (Гость)";
      }
      
      // Поиск доступен только для авторизованных пользователей
      els.searchInput.style.display = currentUser ? "block" : "none"; 
      
      let query = sb.from("q").select("*").order("id", { ascending: false });
      
      if (!isAdmin) {
        query = query.eq(filterKey, filterValue);
      }

      const { data, error } = await query;
      if (error) {
        console.error("Error loading links:", error);
        alert("Ошибка загрузки ссылок из базы данных.");
        return;
      }

      allLinks = data || [];
      renderList(allLinks);
    }

    function renderList(items) {
      // Кнопки редактирования и удаления доступны только для авторизованных пользователей
      const showDbActions = !!currentUser; 

      if (items.length === 0) {
        const message = "У вас пока нет ссылок.";
          
        els.linksList.innerHTML = `<div style="text-align:center; padding:20px; color:#9ca3af">${message}</div>`;
        return;
      }

      els.linksList.innerHTML = items.map(item => {
        const shortUrl = `${window.location.origin}/${item.short}`;
        
        let badges = '';
        if (isAdmin && item.user_id && item.user_id !== currentUser.id) {
          // Значок "Чужая" для админа, если это ссылка другого пользователя
          badges += `<span style="font-size:10px; background:#eef2ff; padding:2px 6px; border-radius:4px; color:#4f46e5">Чужая</span>`;
        } else if (isAdmin && item.guest_session_id) {
          // Значок "Гость" для админа, если это гостевая ссылка
          badges += `<span style="font-size:10px; background:#fefce8; padding:2px 6px; border-radius:4px; color:#ca8a04">Гость</span>`;
        }

        const actions = showDbActions ? `
          <button class="action-btn" onclick="openEdit('${item.id}', '${item.url}', '${item.short}')">Изменить</button>
          <button class="action-btn" style="color:#ef4444; border-color:#fecaca" onclick="deleteLink('${item.id}')">Удалить</button>
        ` : '';

        return `
          <div class="item">
            <div class="item-row">
              <div class="link-text" style="font-size:18px; font-family:monospace">${window.location.host}/${item.short}</div>
              ${badges}
            </div>
            <div class="original-link">${item.url}</div>
            
            <div class="actions-bar">
              <button class="action-btn" onclick="copyToClip('${shortUrl}', this)">Копировать</button>
              <a href="${shortUrl}" target="_blank" class="action-btn" style="text-decoration:none">Открыть</a>
              ${actions}
            </div>
          </div>
        `;
      }).join("");
    }

    // --- ACTIONS (для Supabase) ---
    
    // Эти действия применимы только к ссылкам в базе данных для авторизованных пользователей
    window.deleteLink = async (id) => {
      if (!currentUser) return; // Защита от вызова для гостя
      if (confirm("Точно удалить из базы данных?")) {
        const { error } = await sb.from("q").delete().eq("id", id);
        if (!error) loadLinks();
        else alert("Ошибка: " + error.message);
      }
    };

    window.openEdit = (id, url, short) => {
      if (!currentUser) return; // Защита от вызова для гостя
      document.getElementById("editLinkId").value = id;
      document.getElementById("editUrlInput").value = url;
      document.getElementById("editShortCode").value = short;
      els.editModal.style.display = "flex";
    };

    // Общие утилиты
    window.copyToClip = async (text, btn) => {
      try {
        await navigator.clipboard.writeText(text);
        const originalText = btn.innerText;
        btn.innerText = "Скопировано!";
        btn.style.background = "#d1fae5";
        setTimeout(() => { 
          btn.innerText = originalText; 
          btn.style.background = "#f3f4f6"; 
        }, 1500);
      } catch (e) { alert("Ошибка копирования"); }
    };

    // --- FORM SUBMIT (Общая логика для всех) ---
    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = els.urlInput.value.trim();
      
      let code = els.customCode.value.trim().replace(/[^A-Za-z0-9\-_.~]/g, "");
      if (!code) {
        code = generateShortCode(4);
      }

      // 2. Проверка уникальности в Supabase
      const { data: exists } = await sb.from("q").select("id").eq("short", code).limit(1);
      if (exists && exists.length > 0) {
        alert("Код " + code + " уже занят в общей базе данных. Выберите другой.");
        return;
      }

      const shortUrl = `${window.location.origin}/${code}`;

      // 3. Единая логика сохранения в Supabase
      const payload = { 
        url: url, 
        short: code,
        // Если авторизован, используем user_id. Иначе - null
        user_id: currentUser ? currentUser.id : null, 
        // Если гость, используем guestSessionId. Иначе - null
        guest_session_id: currentUser ? null : guestSessionId
      };

      const { error } = await sb.from("q").insert([payload]);
      
      if (error) {
        alert("Ошибка сохранения в Supabase: " + error.message);
      } else {
        els.urlInput.value = "";
        els.customCode.value = "";
        alert(`Ссылка создана: ${shortUrl}`);
        loadLinks();
      }
    });

    // Edit Form Logic (только для Supabase, авторизованных пользователей)
    document.getElementById("editForm").onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      const id = document.getElementById("editLinkId").value;
      const url = document.getElementById("editUrlInput").value.trim();
      const code = document.getElementById("editShortCode").value.trim();

      const { error } = await sb.from("q").update({ url, short: code }).eq("id", id);
      if (error) alert(error.message);
      else {
        els.editModal.style.display = "none";
        loadLinks();
      }
    };

    // UI Utilities
    els.refreshBtn.onclick = loadLinks;
    els.searchInput.oninput = (e) => {
      // Поиск работает только для авторизованных пользователей (для гостей searchInput скрыт)
      if (!currentUser) return;
      const q = e.target.value.toLowerCase();
      renderList(allLinks.filter(x => x.url.toLowerCase().includes(q) || x.short.toLowerCase().includes(q)));
    };
    document.querySelector(".close-modal").onclick = () => els.editModal.style.display = "none";
    els.editModal.onclick = (e) => { if(e.target === els.editModal) els.editModal.style.display = "none"; }

    // Start
    initApp();
  </script>
</body>
              </html>
